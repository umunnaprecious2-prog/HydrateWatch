# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Render reads this file and creates both services below. A few env vars are
# marked `sync: false`, meaning Render will prompt you to fill them in by
# hand (secrets / values only known once the other service exists) instead
# of storing them in this file. See README.md "Deploy to production" for
# the exact values to paste in and in what order.
#
# If the Blueprint parser rejects a field here, Render's dashboard is an
# equivalent manual fallback: "New Web Service" (pointed at
# backend/Dockerfile) for the backend, "New Static Site" (build command
# `npm install && npm run build`, publish directory `frontend/out`) for the
# frontend. Field names below are current as of this writing but Render's
# schema does evolve.

services:
  - type: web
    name: hydratewatch-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      # CockroachDB connection string, e.g.:
      # postgresql://<user>:<password>@<host>:26257/<db>?sslmode=require&connect_timeout=30&pool_timeout=30
      # (use sslmode=require, not verify-full - see README.md "Database: CockroachDB")
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # The frontend service's live URL, for CORS. Fill in after the
      # frontend service below has deployed once.
      - key: FRONTEND_URL
        sync: false

  # Static Site, not a Web Service: the app has no route handlers, middleware,
  # or other server-only features (next.config.js has output: "export"), so
  # it builds to plain HTML/CSS/JS with no Node process needed at runtime.
  # Render serves static sites from a CDN with no idle spin-down, unlike free
  # Web Services which sleep after 15 min and cost ~30-60s to wake back up on
  # the next request - that wake-up delay was the point of this switch.
  - type: web
    name: hydratewatch-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_ENV
        value: production
      # The backend service's live URL (e.g. https://hydratewatch-backend.onrender.com).
      # NEXT_PUBLIC_* vars are baked in at build time, so this must be set
      # before the first build that should use it, and the service redeployed
      # after changing it.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
